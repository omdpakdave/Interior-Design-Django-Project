{% load static %}




<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <style>
        body{
            background:#f5f5f5;
        }


        .signup-box{
            width:450px;
            background:white;
            padding:40px;
            margin:60px auto;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>


<body>


<div class="signup-box">


    <h2 class="text-center mb-4">Add Design</h2>


    {% if msg %}
       
            <div class="alert alert-info">
                {{ msg }}
            </div>
     
    {% endif %}


    <form action="{% url 'add' %}" method="POST" enctype="multipart/form-data">


        {% csrf_token %}




        <div class="mb-3">
            <input type="text"
                   name="dname"
                   class="form-control"
                   placeholder="Enter Name"
                   >
        </div>


        <div class="mb-3">
            <input type="Number"
                   name="dprice"
                   class="form-control"
                   placeholder="Enter Price"
                   >
        </div>


        <div class="mb-3">
            <input type="text"
                   name="desc"
                   class="form-control"
                   placeholder="Enter Description"
                   required>
        </div>

            <div class=" mb-4">
                            <label>Profile</label>
                            <input type="file"
                                   name="dprofile"
                                   class="form-control"
                                   
                                   required>
                        </div>
        
   

        <button type="submit" class="btn btn-primary w-100">
            Add Design
        </button>


    </form>


</div>


</body>
</html>
