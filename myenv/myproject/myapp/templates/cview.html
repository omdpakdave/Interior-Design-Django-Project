{% extends 'header.html' %}
{% block content %}

<div class="container mt-5">
    <div class="row">

        {% for i in product %}
        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="{{ i.dimage.url }}"
                     class="card-img-top"
                     style="height:250px;object-fit:cover;">

                <div class="card-body">

                    <h4>{{ i.dname }}</h4>

                    <h5>₹ {{ i.dprice }}</h5>

                    <p>{{ i.desc }}</p>

                    <a href="{% url 'addwish' pk=i.pk %}"
                       class="btn btn-danger">
                        ❤️ Add to Wishlist
                    </a>

                    <a href="{% url 'addcart' i.pk %}"
                       class="btn btn-success">
                       Add To Cart
                        </a>

                </div>

            </div>

        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
