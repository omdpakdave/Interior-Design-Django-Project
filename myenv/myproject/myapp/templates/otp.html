{% load static %}




<!DOCTYPE html>
<html>
<head>
    <title>Forget Password</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <style>
        body{
            background:#f5f5f5;
        }


        .signup-box{
            width:450px;
            background:white;
            padding:40px;
            margin:60px auto;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>


<body>


<div class="signup-box">


    <h2 class="text-center mb-4">OTP</h2>


    {% if msg %}
       
            <div class="alert alert-info">
                {{ msg }}
            </div>
     
    {% endif %}


    <form action="{% url 'otp' %}" method="POST">


        {% csrf_token %}


        

        <div class="mb-3">
            <input type="number"
                   name="uotp"
                   class="form-control"
                   placeholder="Enter OTP"
                   required>
        </div>


     


        

        <button type="submit" class="btn btn-primary w-100">
            Submit otp
        </button>

       

    </form>


</div>


</body>
</html>
