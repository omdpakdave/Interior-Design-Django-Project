{% load static %}




<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <style>
        body{
            background:#f5f5f5;
        }


        .signup-box{
            width:450px;
            background:white;
            padding:40px;
            margin:60px auto;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>


<body>


<div class="signup-box">


    <h2 class="text-center mb-4">Create Account</h2>


    {% if msg %}
       
            <div class="alert alert-info">
                {{ msg }}
            </div>
     
    {% endif %}


    <form action="{% url 'signup' %}" method="POST" enctype="multipart/form-data">


        {% csrf_token %}

        <div class="mb-3">
            <select  name="usertype" id="">
                <option value=""hidden>---Usertype---</option>
                <option value="customer">---customer---</option>
                <option value="agency">---agency---</option>
                
        </div>



        <div class="mb-3">
            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Enter Name"
                   required>
        </div>


        <div class="mb-3">
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter Email"
                   required>
        </div>


        <div class="mb-3">
            <input type="tel"
                   name="mobile"
                   class="form-control"
                   placeholder="Enter Mobile Number"
                   required>
        </div>


        <div class="mb-3">
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter Password"
                   required>
        </div>


        <div class="mb-3">
            <input type="password"
                   name="cpassword"
                   class="form-control"
                   placeholder="Confirm Password"
                   required>
        </div>
        <div class=" mb-4">
                            <label>Profile</label>
                            <input type="file"
                                   name="profile"
                                   class="form-control"
                                   
                                   required>
                        </div>


        <button type="submit" class="btn btn-primary w-100">
            Register
        </button>


    </form>


</div>


</body>
</html>
